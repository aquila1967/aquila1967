<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 诊断</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .log { background: #1e1e1e; color: #fff; padding: 16px; border-radius: 8px; min-height: 200px; white-space: pre-wrap; font-size: 0.9rem; }
        button { padding: 10px 20px; margin: 4px; cursor: pointer; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h2>📡 Supabase 网络诊断工具</h2>

    <!-- 使用多个备用 CDN -->
    <script>
        // 动态加载 Supabase SDK，如果失败则尝试下一个源
        const cdnSources = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
            'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js',
            'https://registry.npmmirror.com/@supabase/supabase-js/2.39.3/files/dist/umd/supabase.min.js'
        ];

        function loadScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            script.onerror = function() {
                log(`⚠️ 无法从 ${src} 加载 SDK`, 'error');
                script.remove();
            };
            document.head.appendChild(script);
        }
    </script>

    <div>
        <p><strong>当前状态：</strong><span id="statusText">⏳ 正在加载 SDK...</span></p>
    </div>

    <button onclick="testAPI()">🔗 直接测试 API 连接</button>
    <button onclick="testFetch()">📡 测试网络连通性</button>
    <button onclick="testInsert()">📝 测试插入</button>
    <button onclick="testQuery()">📊 测试查询</button>

    <h3>📋 日志：</h3>
    <div class="log" id="logOutput"></div>

    <script>
        // ========== 配置 ==========
        const SUPABASE_URL = 'https://bvmvuirjmlsbuefnsvm.supabase.co';  // ← 改为你的 Project URL
        const SUPABASE_KEY = 'sb_publishable__J9jNEj_RmSoKegqreOEQw_cGPCozvg';                     // ← 改为你的 anon key

        let supabase = null;

        function log(msg, className = '') {
            const output = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            const prefix = className ? `<span class="${className}">[${time}] ${msg}</span>` : `[${time}] ${msg}`;
            output.innerHTML += prefix + '\n';
            output.scrollTop = output.scrollHeight;
        }

        // 尝试加载 SDK
        let loadedIndex = 0;
        function tryNextCDN() {
            if (loadedIndex < cdnSources.length) {
                log(`⏳ 尝试从 CDN ${loadedIndex + 1} 加载...`);
                loadScript(cdnSources[loadedIndex], () => {
                    log('✅ SDK 加载成功！', 'success');
                    initSupabase();
                });
                loadedIndex++;
            } else {
                log('❌ 所有 CDN 均加载失败，请手动下载 SDK 文件', 'error');
                document.getElementById('statusText').innerHTML = '🔴 SDK 加载失败';
            }
        }

        function initSupabase() {
            if (typeof window.supabase === 'undefined') {
                log('❌ SDK 对象不存在', 'error');
                return;
            }
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('✅ Supabase 客户端创建成功', 'success');
                log(`   URL: ${SUPABASE_URL}`);
                log(`   Key: ${SUPABASE_KEY.substring(0, 15)}...`);
                document.getElementById('statusText').innerHTML = '🟢 已初始化';
            } catch (e) {
                log('❌ 创建失败: ' + e.message, 'error');
                document.getElementById('statusText').innerHTML = '🔴 初始化失败';
            }
        }

        // 直接测试 API 连接（最底层测试）
        window.testAPI = async function() {
            if (!SUPABASE_URL.startsWith('https://')) {
                log('❌ URL 必须以 https:// 开头', 'error');
                return;
            }
            log('⏳ 直接测试 API 端点...');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: { 'apikey': SUPABASE_KEY }
                });
                log(`   响应状态: ${response.status}`, response.ok ? 'success' : 'error');
                if (response.ok) {
                    log('✅ API 端点可达！', 'success');
                } else {
                    log(`❌ API 返回错误: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (e) {
                log('❌ 网络请求失败: ' + e.message, 'error');
                log('   可能原因：', 'error');
                log('   1. URL 不正确或项目不存在', 'error');
                log('   2. 项目已暂停（请在 Supabase 控制台恢复）', 'error');
                log('   3. 网络防火墙阻止', 'error');
            }
        };

        window.testFetch = async function() {
            log('⏳ 测试基础网络...');
            try {
                const response = await fetch('https://www.baidu.com');
                log(`   百度状态: ${response.status} ${response.ok ? '✅ 可达' : '❌ 异常'}`, response.ok ? 'success' : 'error');
            } catch (e) {
                log('❌ 基础网络不通: ' + e.message, 'error');
            }
        };

        window.testInsert = async function() {
            if (!supabase) { log('❌ 客户端未初始化', 'error'); return; }
            log('⏳ 尝试插入...');
            try {
                const { error } = await supabase.from('patient_records').insert({
                    patient_name: '测试', gender: '男', age: 30, ethnicity: '汉',
                    address: '测试', phone: '12345678901', check_in_date: '2026-01-01',
                    stay_months: 1, stay_days: 0, stay_duration: '1月0天',
                    occupancy_count: 1, has_infectious_disease: '无', disease_detail: '',
                    diagnosis_image_url: null
                });
                if (error) {
                    log('❌ 插入失败: ' + error.message, 'error');
                    if (error.message.includes('Failed to fetch')) {
                        log('💡 请先点击"直接测试 API 连接"按钮', '');
                    }
                } else {
                    log('✅ 插入成功！', 'success');
                }
            } catch (e) {
                log('❌ 异常: ' + e.message, 'error');
            }
        };

        window.testQuery = async function() {
            if (!supabase) { log('❌ 客户端未初始化', 'error'); return; }
            log('⏳ 尝试查询...');
            try {
                const { data, error } = await supabase.from('patient_records').select('*');
                if (error) {
                    log('❌ 查询失败: ' + error.message, 'error');
                } else {
                    log(`✅ 查询成功，共 ${data.length} 条`, 'success');
                }
            } catch (e) {
                log('❌ 异常: ' + e.message, 'error');
            }
        };

        // 开始加载
        window.addEventListener('DOMContentLoaded', tryNextCDN);
    </script>
</body>
</html>
