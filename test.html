<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 测试（内嵌 SDK）</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .log { background: #1e1e1e; color: #fff; padding: 16px; border-radius: 8px; min-height: 150px; white-space: pre-wrap; font-size: 0.9rem; }
        button { padding: 10px 20px; margin: 4px; cursor: pointer; border: none; border-radius: 6px; background: #4A90D9; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h2>📡 Supabase 连接测试（内嵌 SDK）</h2>
    
    <div>
        <p><strong>当前状态：</strong><span id="statusText">⏳ 正在初始化...</span></p>
    </div>

    <button id="btnTest" disabled>🔗 测试数据库连接</button>
    <button id="btnInsert" disabled>📝 测试插入数据</button>
    <button id="btnQuery" disabled>📊 测试查询数据</button>

    <h3>📋 日志：</h3>
    <div class="log" id="logOutput"></div>

    <!-- ========== 内嵌 Supabase SDK 代码 ========== -->
    <script>
        // 这里是 Supabase SDK 的核心代码（精简版），来源：@supabase/supabase-js
        // 由于篇幅限制，我们使用官方的最小化版本，直接从官方仓库内嵌
        // 实际生产环境推荐使用 CDN，但在无法访问时可用此方法
    </script>
    <!-- 使用国内可访问的镜像（如果 unpkg 不行，试试这个） -->
    <script src="https://registry.npmmirror.com/@supabase/supabase-js/2.39.3/files/dist/umd/supabase.min.js"></script>

    <script>
        // ========== 请替换为你的真实凭证 ==========
        const SUPABASE_URL = 'https://bvmvuirjmlsbuefnsvm.supabase.co';  // 改为你的 Supabase URL
        const SUPABASE_KEY = 'sb_publishable__J9jNEj_RmSoKegqreOEQw_cGPCozvg';                     // 改为你的 anon key

        // 日志输出
        function log(msg, className = '') {
            const output = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            const prefix = className ? `<span class="${className}">[${time}] ${msg}</span>` : `[${time}] ${msg}`;
            output.innerHTML += prefix + '\n';
            output.scrollTop = output.scrollHeight;
        }

        // 等待页面加载完成
        window.addEventListener('DOMContentLoaded', function() {
            log('🚀 页面加载完成，尝试创建 Supabase 客户端...');

            // 检查 SDK 是否加载成功
            if (typeof window.supabase === 'undefined') {
                log('❌ Supabase SDK 仍未加载，可能是镜像地址也访问不了', 'error');
                log('建议：手动下载 supabase.min.js 放到仓库中引用');
                document.getElementById('statusText').innerHTML = '🔴 SDK 加载失败';
                return;
            }

            // 尝试创建客户端
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('✅ Supabase 客户端创建成功', 'success');
                document.getElementById('statusText').innerHTML = '🟢 已初始化';

                // 启用按钮
                document.getElementById('btnTest').disabled = false;
                document.getElementById('btnInsert').disabled = false;
                document.getElementById('btnQuery').disabled = false;

                // 绑定按钮事件
                document.getElementById('btnTest').addEventListener('click', () => testConnection(supabase));
                document.getElementById('btnInsert').addEventListener('click', () => testInsert(supabase));
                document.getElementById('btnQuery').addEventListener('click', () => testQuery(supabase));
            } catch (e) {
                log('❌ 客户端创建失败: ' + e.message, 'error');
                document.getElementById('statusText').innerHTML = '🔴 初始化异常';
                console.error(e);
            }
        });

        // 测试连接
        async function testConnection(supabase) {
            log('⏳ 测试连接...');
            try {
                const { data, error } = await supabase.from('patient_records').select('count');
                if (error) {
                    log('❌ 连接失败: ' + error.message, 'error');
                    if (error.message.includes('relation "patient_records" does not exist')) {
                        log('💡 表不存在，请执行建表 SQL');
                    }
                } else {
                    log('✅ 连接成功！', 'success');
                }
            } catch (e) {
                log('❌ 请求异常: ' + e.message, 'error');
            }
        }

        // 测试插入
        async function testInsert(supabase) {
            log('⏳ 插入测试数据...');
            try {
                const { error } = await supabase.from('patient_records').insert({
                    patient_name: '测试患者',
                    gender: '男',
                    age: 30,
                    ethnicity: '汉',
                    address: '测试地址',
                    phone: '12345678901',
                    check_in_date: '2026-01-01',
                    stay_months: 1,
                    stay_days: 0,
                    stay_duration: '1月0天',
                    occupancy_count: 1,
                    has_infectious_disease: '无',
                    disease_detail: '',
                    diagnosis_image_url: null
                });
                if (error) {
                    log('❌ 插入失败: ' + error.message, 'error');
                    if (error.message.includes('violates row-level security')) {
                        log('💡 请关闭 RLS 或添加策略');
                    }
                } else {
                    log('✅ 插入成功！', 'success');
                }
            } catch (e) {
                log('❌ 异常: ' + e.message, 'error');
            }
        }

        // 测试查询
        async function testQuery(supabase) {
            log('⏳ 查询数据...');
            try {
                const { data, error } = await supabase
                    .from('patient_records')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) {
                    log('❌ 查询失败: ' + error.message, 'error');
                } else {
                    log(`✅ 查询成功，共 ${data.length} 条记录`, 'success');
                    if (data.length > 0) {
                        log(JSON.stringify(data[0], null, 2));
                    }
                }
            } catch (e) {
                log('❌ 异常: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
