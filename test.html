<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 纯文本测试</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .log { background: #1e1e1e; color: #fff; padding: 16px; border-radius: 8px; min-height: 150px; white-space: pre-wrap; font-size: 0.9rem; }
        button { padding: 10px 20px; margin: 4px; cursor: pointer; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
    </style>
</head>
<body>
    <h2>📡 Supabase 纯文本连接测试</h2>
    
    <div>
        <p><strong>当前状态：</strong><span id="statusText">⏳ 正在初始化...</span></p>
    </div>

    <button onclick="testConnection()">🔗 测试连接</button>
    <button onclick="testInsert()">📝 测试插入</button>
    <button onclick="testQuery()">📊 测试查询</button>

    <h3>📋 日志：</h3>
    <div class="log" id="logOutput"></div>

    <script>
        // ========== 请在这里替换为你的真实凭证 ==========
        const SUPABASE_URL = 'https://your-project.supabase.co';  // 例如：https://abcdefg.supabase.co
        const SUPABASE_KEY = 'your-anon-key';                     // 很长的一串，从 Supabase 设置获取

        // 日志输出
        function log(msg, className = '') {
            const output = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            const prefix = className ? `<span class="${className}">[${time}] ${msg}</span>` : `[${time}] ${msg}`;
            output.innerHTML += prefix + '\n';
            output.scrollTop = output.scrollHeight;
        }

        // 初始化 Supabase
        let supabase = null;
        
        function initSupabase() {
            // 1. 检查 SDK 是否加载
            if (typeof window.supabase === 'undefined') {
                log('❌ 严重错误：Supabase SDK 未加载，请检查网络或 CDN', 'error');
                document.getElementById('statusText').innerHTML = '🔴 SDK 未加载';
                return false;
            }

            // 2. 检查 URL 格式
            if (!SUPABASE_URL.startsWith('https://')) {
                log('❌ SUPABASE_URL 必须以 https:// 开头，当前值: ' + SUPABASE_URL, 'error');
                document.getElementById('statusText').innerHTML = '🔴 URL 格式错误';
                return false;
            }

            if (SUPABASE_URL.includes('your-project') || SUPABASE_URL === '') {
                log('❌ 请将 SUPABASE_URL 替换为您的真实项目 URL', 'error');
                document.getElementById('statusText').innerHTML = '🔴 凭证未配置';
                return false;
            }

            // 3. 尝试创建客户端
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('✅ Supabase 客户端创建成功', 'success');
                log('   URL: ' + SUPABASE_URL);
                document.getElementById('statusText').innerHTML = '🟢 已初始化';
                return true;
            } catch (e) {
                log('❌ 客户端创建失败: ' + e.message, 'error');
                document.getElementById('statusText').innerHTML = '🔴 初始化异常';
                console.error(e);
                return false;
            }
        }

        // 页面加载后立即初始化
        window.addEventListener('DOMContentLoaded', function() {
            log('🚀 页面已加载，开始初始化...');
            initSupabase();
        });

        // 测试连接（查询 Supabase 时间）
        window.testConnection = async function() {
            if (!supabase) {
                log('❌ Supabase 未初始化，请先解决上面的错误', 'error');
                return;
            }
            log('⏳ 正在测试连接...');
            try {
                const { data, error } = await supabase.from('patient_records').select('count');
                if (error) {
                    log('❌ 连接失败: ' + error.message, 'error');
                    if (error.message.includes('relation "patient_records" does not exist')) {
                        log('💡 提示：表 patient_records 不存在，请先执行建表 SQL', '');
                    }
                } else {
                    log('✅ 连接成功！数据库响应正常', 'success');
                }
            } catch (e) {
                log('❌ 请求异常: ' + e.message, 'error');
            }
        };

        // 测试插入
        window.testInsert = async function() {
            if (!supabase) {
                log('❌ Supabase 未初始化', 'error');
                return;
            }
            log('⏳ 正在插入测试记录...');
            try {
                const { error } = await supabase.from('patient_records').insert({
                    patient_name: '测试患者',
                    gender: '男',
                    age: 30,
                    ethnicity: '汉',
                    address: '测试地址',
                    phone: '12345678901',
                    check_in_date: '2026-01-01',
                    stay_months: 1,
                    stay_days: 0,
                    stay_duration: '1月0天',
                    occupancy_count: 1,
                    has_infectious_disease: '无',
                    disease_detail: '',
                    diagnosis_image_url: null
                });
                if (error) {
                    log('❌ 插入失败: ' + error.message, 'error');
                    if (error.message.includes('violates row-level security')) {
                        log('💡 提示：请关闭 patient_records 表的 RLS 或添加插入策略', '');
                    }
                } else {
                    log('✅ 插入成功！', 'success');
                }
            } catch (e) {
                log('❌ 请求异常: ' + e.message, 'error');
            }
        };

        // 测试查询
        window.testQuery = async function() {
            if (!supabase) {
                log('❌ Supabase 未初始化', 'error');
                return;
            }
            log('⏳ 正在查询数据...');
            try {
                const { data, error } = await supabase
                    .from('patient_records')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) {
                    log('❌ 查询失败: ' + error.message, 'error');
                } else {
                    log(`✅ 查询成功，共 ${data.length} 条记录`, 'success');
                    if (data.length > 0) {
                        log('第一条记录: ' + JSON.stringify(data[0], null, 2));
                    }
                }
            } catch (e) {
                log('❌ 请求异常: ' + e.message, 'error');
            }
        };
    </script>
</body>
</html>
