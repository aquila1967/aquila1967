<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者信息登记系统</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* 您的完整 CSS 样式（保持不变） */
    </style>
</head>
<body>
    <!-- 您的完整 HTML 结构（保持不变） -->

    <script>
        // ==================== 配置 ====================
        const EMAILJS_PUBLIC_KEY = '您的Public Key';      // 从 EmailJS 获取
        const EMAILJS_SERVICE_ID = '您的Service ID';     // 从 EmailJS 获取
        const EMAILJS_TEMPLATE_ID = '您的Template ID';   // 从 EmailJS 获取
        const ADMIN_PASSWORD = 'admin2024';
        const YOUR_EMAIL = '您的邮箱@gmail.com';          // 接收备份的邮箱

        // 初始化 EmailJS
        (function() {
            emailjs.init(EMAILJS_PUBLIC_KEY);
            console.log('✅ EmailJS 初始化成功');
        })();

        let uploadedFile = null;
        let allRecords = [];

        // ==================== 工具函数 ====================
        function showToast(msg, type) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.style.animation = 'fadeOut 0.4s forwards'; setTimeout(() => t.remove(), 400); }, 2500);
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        // ==================== 二维码 ====================
        function generateQR() {
            const url = window.location.href.split('?')[0];
            document.getElementById('pageUrlDisplay').textContent = url;
            const qr = document.getElementById('qrCodeContainer');
            if (qr && typeof QRCode !== 'undefined') {
                qr.innerHTML = '';
                new QRCode(qr, { text: url, width: 150, height: 150 });
            }
        }

        // ==================== 图片上传 ====================
        function setupUpload() {
            const fi = document.getElementById('diagnosisFile');
            const prev = document.getElementById('uploadPreview');
            const area = document.getElementById('uploadArea');
            const rm = document.getElementById('uploadRemove');

            fi.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) return;
                if (file.size > 10*1024*1024) return showToast('图片不能超过10MB','error');
                uploadedFile = file;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    prev.src = ev.target.result;
                    prev.classList.add('show');
                    area.classList.add('has-file');
                    rm.classList.add('show');
                };
                reader.readAsDataURL(file);
            });

            rm.addEventListener('click', function(e) {
                e.stopPropagation();
                uploadedFile = null;
                prev.src = '';
                prev.classList.remove('show');
                area.classList.remove('has-file');
                rm.classList.remove('show');
                fi.value = '';
            });
        }

        // ==================== 条件显示 ====================
        function setupCondition() {
            const yes = document.getElementById('diseaseYes');
            const no = document.getElementById('diseaseNo');
            const field = document.getElementById('diseaseDetailField');
            function toggle() { field.classList.toggle('visible', yes.checked); }
            yes.addEventListener('change', toggle);
            no.addEventListener('change', toggle);
            toggle();
        }

        // ==================== 表单提交 ====================
        async function handleSubmit() {
            console.log('🚀 提交按钮被点击');

            // 获取表单数据
            const patientName = document.getElementById('patientName').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked')?.value;
            const age = parseInt(document.getElementById('age').value);
            const ethnicity = document.getElementById('ethnicity').value.trim();
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const checkInDate = document.getElementById('checkInDate').value;
            const stayMonths = parseInt(document.getElementById('stayMonths').value) || 0;
            const stayDays = parseInt(document.getElementById('stayDays').value) || 0;
            const occupancyCount = parseInt(document.getElementById('occupancyCount').value) || 1;
            const hasDisease = document.querySelector('input[name="hasDisease"]:checked')?.value;
            const diseaseDetail = document.getElementById('diseaseDetail').value.trim();

            // 验证
            if (!patientName) return showToast('请输入患者姓名', 'error');
            if (!gender) return showToast('请选择性别', 'error');
            if (!age || age < 0 || age > 150) return showToast('请输入有效年龄', 'error');
            if (!address) return showToast('请输入家庭住址', 'error');
            if (!phone || !/^[0-9\-]{7,15}$/.test(phone)) return showToast('请输入有效联系电话', 'error');
            if (!checkInDate) return showToast('请选择入住时间', 'error');
            if (hasDisease === '有' && !diseaseDetail) return showToast('请填写具体疾病信息', 'error');

            console.log('✅ 验证通过');

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const stayDuration = stayMonths + '月' + stayDays + '天';
                const submitTime = new Date().toLocaleString('zh-CN');

                const record = {
                    patient_name: patientName,
                    gender: gender,
                    age: age,
                    ethnicity: ethnicity,
                    address: address,
                    phone: phone,
                    check_in_date: checkInDate,
                    stay_months: stayMonths,
                    stay_days: stayDays,
                    stay_duration: stayDuration,
                    occupancy_count: occupancyCount,
                    has_infectious_disease: hasDisease,
                    disease_detail: hasDisease === '有' ? diseaseDetail : '',
                    diagnosis_image_url: uploadedFile ? '已上传图片' : '无',
                    submit_time: submitTime
                };

                // 保存到本地存储
                let local = JSON.parse(localStorage.getItem('patient_records') || '[]');
                record.id = Date.now();
                record.created_at = new Date().toISOString();
                local.unshift(record);
                localStorage.setItem('patient_records', JSON.stringify(local));
                console.log('✅ 已保存到本地存储');

                // 发送邮件备份
                try {
                    const templateParams = {
                        patient_name: patientName,
                        gender: gender,
                        age: age,
                        ethnicity: ethnicity || '未填写',
                        address: address,
                        phone: phone,
                        check_in_date: checkInDate,
                        stay_duration: stayDuration,
                        occupancy_count: occupancyCount,
                        has_infectious_disease: hasDisease || '无',
                        disease_detail: diseaseDetail || '无',
                        submit_time: submitTime
                    };

                    await emailjs.send(
                        EMAILJS_SERVICE_ID,
                        EMAILJS_TEMPLATE_ID,
                        templateParams
                    );
                    console.log('✅ 邮件已发送');
                } catch (emailError) {
                    console.warn('⚠️ 邮件发送失败（数据已保存到本地）:', emailError);
                }

                showToast('✅ 提交成功！', 'success');
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successPage').style.display = 'block';
            } catch (error) {
                console.error('❌ 提交失败:', error);
                showToast('提交失败，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 提交信息';
            }
        }

        // ==================== 管理后台 ====================
        function adminLogin() {
            if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
                document.getElementById('adminLoginCard').classList.add('admin-hidden');
                document.getElementById('adminPanel').classList.remove('admin-hidden');
                refreshRecords();
            } else showToast('密码错误','error');
        }

        function refreshRecords() {
            allRecords = JSON.parse(localStorage.getItem('patient_records') || '[]');
            renderTable();
            showToast('数据已刷新','info');
        }

        function renderTable() {
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const filtered = allRecords.filter(r =>
                (r.patient_name||'').toLowerCase().includes(search) ||
                (r.phone||'').includes(search)
            );
            document.getElementById('recordCount').textContent = allRecords.length;
            const tbody = document.getElementById('tableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            document.getElementById('emptyState').style.display = 'none';
            tbody.innerHTML = filtered.map((r, i) => `
                <tr onclick="viewDetail(${r.id})">
                    <td>${i+1}</td><td><strong>${escapeHtml(r.patient_name)}</strong></td>
                    <td>${r.gender}</td><td>${r.age}</td><td>${r.phone}</td>
                    <td>${r.check_in_date}</td><td>${r.stay_duration||''}</td>
                    <td>${r.has_infectious_disease==='有' ? '<span class="badge badge-yes">有</span>' : '<span class="badge badge-no">无</span>'}</td>
                    <td>${new Date(r.created_at).toLocaleString()}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDelete(${r.id})">🗑</button></td>
                </tr>
            `).join('');
        }

        // ... 其他函数保持不变 ...

        // ==================== 事件绑定 ====================
        document.addEventListener('DOMContentLoaded', function() {
            generateQR();
            setupUpload();
            setupCondition();

            document.getElementById('submitBtn').addEventListener('click', handleSubmit);
            // ... 其他事件绑定 ...
        });
    </script>
</body>
</html>
