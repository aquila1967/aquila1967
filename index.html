<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CloudBase 连接测试</title>
    <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@1.7.3/dist/cloudbase.full.js"></script>
</head>
<body>
    <div style="padding: 40px; font-family: sans-serif;">
        <h2>CloudBase 连接测试</h2>
        <div id="status" style="padding: 20px; background: #f0f0f0; border-radius: 8px; margin: 20px 0;">
            正在初始化...
        </div>
        <button id="testBtn" disabled style="padding: 12px 24px; font-size: 16px; cursor: pointer;">测试提交</button>
        <div id="result" style="margin-top: 20px; padding: 10px;"></div>
    </div>

    <script>
        // 等待页面完全加载后再执行
        window.onload = function() {
            const statusDiv = document.getElementById('status');
            const testBtn = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            
            const ENV_ID = 'patient-system-d1gnjt0b6782fb310';

            // 检查 SDK 是否加载
            if (typeof cloudbase === 'undefined') {
                statusDiv.innerHTML = '❌ SDK 未加载，请检查网络';
                statusDiv.style.background = '#ffe0e0';
                return;
            }
            
            statusDiv.innerHTML = 'SDK 已加载，正在初始化...';
            
            try {
                const app = cloudbase.init({ env: ENV_ID });
                
                app.auth({ persistence: 'local' }).anonymousAuthProvider().signIn()
                    .then(function() {
                        statusDiv.innerHTML = '✅ CloudBase 初始化成功！';
                        statusDiv.style.background = '#e0ffe0';
                        testBtn.disabled = false;
                        console.log('✅ 初始化成功');
                    })
                    .catch(function(err) {
                        statusDiv.innerHTML = '❌ 初始化失败: ' + err.message;
                        statusDiv.style.background = '#ffe0e0';
                        console.error('初始化失败:', err);
                    });
            } catch(e) {
                statusDiv.innerHTML = '❌ 初始化异常: ' + e.message;
                statusDiv.style.background = '#ffe0e0';
            }

            // 测试提交按钮
            testBtn.onclick = async function() {
                testBtn.disabled = true;
                testBtn.textContent = '提交中...';
                resultDiv.innerHTML = '';
                
                try {
                    const app = cloudbase.init({ env: ENV_ID });
                    const db = app.database();
                    
                    await db.collection('patient_records').add({
                        patient_name: '测试患者',
                        gender: '男',
                        age: 30,
                        ethnicity: '汉族',
                        address: '测试地址',
                        phone: '13800138000',
                        check_in_date: '2026-06-08',
                        stay_months: 1,
                        stay_days: 0,
                        stay_duration: '1月0天',
                        occupancy_count: 1,
                        has_infectious_disease: '无',
                        disease_detail: '',
                        createdAt: new Date()
                    });
                    
                    resultDiv.innerHTML = '<p style="color: green;">✅ 提交成功！请到 CloudBase 控制台查看数据。</p>';
                    console.log('✅ 提交成功');
                } catch(error) {
                    resultDiv.innerHTML = '<p style="color: red;">❌ 提交失败: ' + error.message + '</p>';
                    console.error('提交失败:', error);
                } finally {
                    testBtn.disabled = false;
                    testBtn.textContent = '测试提交';
                }
            };
        };
    </script>
</body>
</html>
