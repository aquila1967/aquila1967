<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者信息登记系统</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4A90D9; --success: #52C41A; --danger: #E74C3C;
            --bg: #f5f7fa; --card-bg: #ffffff; --text: #2c3e50;
            --border: #e0e6ed; --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 16px;
        }
        .nav-bar { width:100%; max-width:600px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .nav-logo { font-size:1.3rem; font-weight:700; color:var(--primary); }
        .nav-link { font-size:0.9rem; padding:8px 16px; border-radius:20px; cursor:pointer; border:none; background:rgba(74,144,217,0.08); color:var(--primary); }
        .nav-link.admin-link { background:transparent; color:#666; }
        .qr-card { background:var(--card-bg); border-radius:var(--radius); padding:20px; max-width:600px; width:100%; margin-bottom:16px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .qr-container { display:flex; justify-content:center; margin:10px 0; }
        .card { background:var(--card-bg); border-radius:var(--radius); padding:24px; max-width:600px; width:100%; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .card-header { text-align:center; margin-bottom:20px; padding-bottom:15px; border-bottom:2px solid #f0f4f8; }
        .form-group { margin-bottom:16px; }
        .form-label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:6px; }
        .form-label .required { color:var(--danger); }
        .form-input, .form-textarea { width:100%; padding:12px; border:2px solid var(--border); border-radius:10px; font-size:1rem; background:#fafbfc; outline:none; }
        .form-input:focus, .form-textarea:focus { border-color:var(--primary); background:#fff; }
        .form-textarea { resize:vertical; min-height:80px; }
        .form-row { display:flex; gap:10px; }
        .radio-group { display:flex; gap:10px; }
        .radio-option { flex:1; }
        .radio-option input { display:none; }
        .radio-option label { display:flex; align-items:center; justify-content:center; padding:12px; border:2px solid var(--border); border-radius:10px; cursor:pointer; background:#fafbfc; text-align:center; }
        .radio-option input:checked+label { border-color:var(--primary); background:#eef5fc; color:var(--primary); font-weight:700; }
        .conditional-field { overflow:hidden; max-height:0; opacity:0; transition:all 0.3s; }
        .conditional-field.visible { max-height:150px; opacity:1; margin-top:12px; }
        .upload-area { border:2px dashed var(--border); border-radius:12px; padding:20px; text-align:center; cursor:pointer; background:#fafbfc; position:relative; }
        .upload-area.has-file { border-color:var(--success); background:#f6fdf8; }
        .upload-preview { max-width:100%; max-height:200px; border-radius:8px; margin-top:12px; display:none; }
        .upload-preview.show { display:block; }
        .upload-remove { display:none; margin-top:8px; color:var(--danger); cursor:pointer; }
        .upload-remove.show { display:inline-block; }
        .upload-area input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .btn { width:100%; padding:14px; font-size:1rem; font-weight:600; border-radius:10px; cursor:pointer; border:none; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:disabled { background:#b0cde8; cursor:not-allowed; }
        .btn-outline { background:#fff; color:var(--primary); border:2px solid var(--primary); }
        .btn-sm { padding:8px 16px; font-size:0.85rem; width:auto; }
        .btn-danger { background:#fff; color:var(--danger); border:1px solid #fcc; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; padding:14px 24px; border-radius:10px; color:#fff; font-weight:600; animation:slideDown 0.3s; }
        .toast.success { background:#27ae60; } .toast.error { background:#e74c3c; } .toast.info { background:#2c3e50; }
        @keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-30px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
        @keyframes fadeOut { from{opacity:1;} to{opacity:0;} }
        .success-page { text-align:center; display:none; }
        .admin-hidden { display:none !important; }
        .table-wrapper { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; min-width:700px; }
        table th, table td { padding:10px; text-align:left; border-bottom:1px solid #eee; }
        table th { background:#f8fafc; font-weight:700; }
        table tbody tr:hover { background:#f8fafd; cursor:pointer; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; }
        .badge-yes { background:#fff0f0; color:#c0392b; } .badge-no { background:#f0faf4; color:#27ae60; }
        .detail-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center; }
        .detail-modal { background:#fff; border-radius:16px; padding:24px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; position:relative; }
        .detail-row { display:flex; padding:8px 0; border-bottom:1px solid #f0f0f0; }
        .detail-label { font-weight:600; min-width:80px; color:#666; }
        .modal-close { position:absolute; top:10px; right:15px; font-size:1.5rem; cursor:pointer; background:none; border:none; }
        .empty-state { text-align:center; padding:40px; color:#aaa; }
        .toolbar { display:flex; gap:10px; margin-bottom:15px; }
        .search-input { flex:1; padding:10px; border:2px solid var(--border); border-radius:10px; outline:none; }
    </style>
</head>
<body>

    <div id="formPage">
        <div class="nav-bar">
            <div class="nav-logo">📋 患者登记</div>
            <button class="nav-link admin-link" onclick="showAdmin()">🔐 管理后台</button>
        </div>

        <div class="qr-card">
            <h3>📱 手机扫码填写</h3>
            <div class="qr-container" id="qrCodeContainer"></div>
            <p style="font-size:0.8rem;color:#888;">扫描二维码打开登记表</p>
        </div>

        <div class="card" id="formCard">
            <div class="card-header">
                <h1>📝 患者信息登记表</h1>
                <p style="color:#666;">带 <span style="color:#E74C3C;">*</span> 为必填项</p>
            </div>
            <form onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label">1. 患者姓名 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="patientName" placeholder="请输入患者姓名">
                </div>
                <div class="form-group">
                    <label class="form-label">2. 患者性别 <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option"><input type="radio" name="gender" value="男" id="genderMale"><label for="genderMale">👨 男</label></div>
                        <div class="radio-option"><input type="radio" name="gender" value="女" id="genderFemale"><label for="genderFemale">👩 女</label></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">3. 患者年龄 <span class="required">*</span></label>
                    <input type="number" class="form-input" id="age" placeholder="请输入年龄">
                </div>
                <div class="form-group">
                    <label class="form-label">4. 民族</label>
                    <input type="text" class="form-input" id="ethnicity" placeholder="例如：汉族">
                </div>
                <div class="form-group">
                    <label class="form-label">5. 家庭住址 <span class="required">*</span></label>
                    <input type="text" class="form-input" id="address" placeholder="xx省xx市xx县">
                </div>
                <div class="form-group">
                    <label class="form-label">6. 联系电话 <span class="required">*</span></label>
                    <input type="tel" class="form-input" id="phone" placeholder="请输入手机号码">
                </div>
                <div class="form-group">
                    <label class="form-label">7. 入住时间 <span class="required">*</span></label>
                    <input type="date" class="form-input" id="checkInDate">
                </div>
                <div class="form-group">
                    <label class="form-label">8. 入住时长 <span class="required">*</span></label>
                    <div class="form-row">
                        <input type="number" class="form-input" id="stayMonths" placeholder="月" min="0" style="flex:1;text-align:center;">
                        <span style="padding:10px;">—</span>
                        <input type="number" class="form-input" id="stayDays" placeholder="天" min="0" max="31" style="flex:1;text-align:center;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">9. 入住人数 <span class="required">*</span></label>
                    <input type="number" class="form-input" id="occupancyCount" placeholder="请输入入住人数">
                </div>
                <div class="form-group">
                    <label class="form-label">10. 有无传染性疾病 <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option"><input type="radio" name="hasDisease" value="无" id="diseaseNo" checked><label for="diseaseNo">✅ 无</label></div>
                        <div class="radio-option"><input type="radio" name="hasDisease" value="有" id="diseaseYes"><label for="diseaseYes">⚠️ 有</label></div>
                    </div>
                    <div class="conditional-field" id="diseaseDetailField">
                        <textarea class="form-textarea" id="diseaseDetail" placeholder="请具体填写传染性疾病名称..."></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">11. 诊断证明（拍照上传）</label>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="diagnosisFile" accept="image/*">
                        <div>📸</div>
                        <div>点击拍照或选择图片</div>
                        <img class="upload-preview" id="uploadPreview">
                        <span class="upload-remove" id="uploadRemove">✕ 移除</span>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">📤 提交信息</button>
            </form>
        </div>

        <div class="card success-page" id="successPage">
            <div style="font-size:3rem;">✅</div>
            <h2>提交成功！</h2>
            <p>患者信息已登记</p>
            <button class="btn btn-outline" onclick="resetForm()">📝 填写新记录</button>
        </div>
    </div>

    <div id="adminPage" class="admin-hidden">
        <div class="nav-bar">
            <div class="nav-logo">⚙️ 管理后台</div>
            <button class="nav-link admin-link" onclick="showForm()">📝 返回</button>
        </div>
        <div class="card" id="adminLoginCard">
            <h1 style="text-align:center;">🔐 管理员登录</h1>
            <div class="form-group"><input type="password" class="form-input" id="adminPassword" placeholder="请输入密码"></div>
            <button class="btn btn-primary" onclick="adminLogin()">🔓 登录</button>
        </div>
        <div class="card admin-hidden" id="adminPanel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <div><h2>📊 患者记录</h2><p>共 <span id="recordCount">0</span> 条（本地存储）</p></div>
                <div>
                    <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 导出CSV</button>
                    <button class="btn btn-outline btn-sm" onclick="refreshRecords()">🔄 刷新</button>
                    <button class="btn btn-danger btn-sm" onclick="adminLogout()">🚪 退出</button>
                </div>
            </div>
            <div class="toolbar"><input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索..." oninput="renderTable()"></div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>#</th><th>姓名</th><th>性别</th><th>年龄</th><th>电话</th><th>入住时间</th><th>时长</th><th>传染</th><th>提交时间</th><th>操作</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="empty-state" id="emptyState">📭 暂无记录</div>
            </div>
        </div>
    </div>

    <div class="detail-modal-overlay admin-hidden" id="detailModal" onclick="if(event.target===this)closeDetail()">
        <div class="detail-modal" id="detailContent"></div>
    </div>
    <div id="toastContainer"></div>

    <script>
        const ADMIN_PASSWORD = 'admin2024';
        let uploadedFile = null;
        let allRecords = [];

        // 数据存储
        function getRecords() {
            try { return JSON.parse(localStorage.getItem('patient_records') || '[]'); }
            catch(e) { return []; }
        }

        function saveRecords(records) {
            localStorage.setItem('patient_records', JSON.stringify(records));
        }

        // 初始化
        (function init() {
            generateQR();
            setupCondition();
            setupUpload();
            var dateEl = document.getElementById('checkInDate');
            if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
        })();

        function showToast(msg, type) {
            var c = document.getElementById('toastContainer');
            var t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(function() { t.style.animation = 'fadeOut 0.4s forwards'; setTimeout(function() { t.remove(); }, 400); }, 2500);
        }

        function escapeHtml(str) {
            var d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        function generateQR() {
            var qr = document.getElementById('qrCodeContainer');
            if (qr && typeof QRCode !== 'undefined') {
                qr.innerHTML = '';
                new QRCode(qr, { text: window.location.href.split('?')[0], width: 150, height: 150 });
            }
        }

        function setupUpload() {
            var fi = document.getElementById('diagnosisFile');
            var prev = document.getElementById('uploadPreview');
            var area = document.getElementById('uploadArea');
            var rm = document.getElementById('uploadRemove');
            if (!fi || !prev || !area || !rm) return;
            fi.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file || !file.type.startsWith('image/')) return;
                if (file.size > 10*1024*1024) return showToast('图片不能超过10MB','error');
                uploadedFile = file;
                var reader = new FileReader();
                reader.onload = function(ev) { prev.src = ev.target.result; prev.classList.add('show'); area.classList.add('has-file'); rm.classList.add('show'); };
                reader.readAsDataURL(file);
            });
            rm.addEventListener('click', function(e) { e.stopPropagation(); uploadedFile = null; prev.src = ''; prev.classList.remove('show'); area.classList.remove('has-file'); rm.classList.remove('show'); fi.value = ''; });
        }

        function setupCondition() {
            var yes = document.getElementById('diseaseYes');
            var no = document.getElementById('diseaseNo');
            var field = document.getElementById('diseaseDetailField');
            if (!yes || !no || !field) return;
            function toggle() { field.classList.toggle('visible', yes.checked); }
            yes.addEventListener('change', toggle);
            no.addEventListener('change', toggle);
        }

        function handleSubmit() {
            var patientName = document.getElementById('patientName').value.trim();
            var gender = document.querySelector('input[name="gender"]:checked');
            gender = gender ? gender.value : null;
            var age = parseInt(document.getElementById('age').value);
            var ethnicity = document.getElementById('ethnicity').value.trim();
            var address = document.getElementById('address').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var checkInDate = document.getElementById('checkInDate').value;
            var stayMonths = parseInt(document.getElementById('stayMonths').value) || 0;
            var stayDays = parseInt(document.getElementById('stayDays').value) || 0;
            var occupancyCount = parseInt(document.getElementById('occupancyCount').value) || 1;
            var hasDisease = document.querySelector('input[name="hasDisease"]:checked');
            hasDisease = hasDisease ? hasDisease.value : '无';
            var diseaseDetail = document.getElementById('diseaseDetail').value.trim();

            if (!patientName) return showToast('请输入患者姓名', 'error');
            if (!gender) return showToast('请选择性别', 'error');
            if (!age || age < 0 || age > 150) return showToast('请输入有效年龄', 'error');
            if (!address) return showToast('请输入家庭住址', 'error');
            if (!phone || !/^[0-9\-]{7,15}$/.test(phone)) return showToast('请输入有效电话', 'error');
            if (!checkInDate) return showToast('请选择入住时间', 'error');
            if (hasDisease === '有' && !diseaseDetail) return showToast('请填写疾病详情', 'error');

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';

            setTimeout(function() {
                var records = getRecords();
                records.unshift({
                    id: Date.now(),
                    patient_name: patientName, gender: gender, age: age, ethnicity: ethnicity,
                    address: address, phone: phone, check_in_date: checkInDate,
                    stay_months: stayMonths, stay_days: stayDays, stay_duration: stayMonths + '月' + stayDays + '天',
                    occupancy_count: occupancyCount, has_infectious_disease: hasDisease,
                    disease_detail: hasDisease === '有' ? diseaseDetail : '',
                    createdAt: new Date().toISOString()
                });
                saveRecords(records);

                showToast('✅ 提交成功！', 'success');
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successPage').style.display = 'block';
                btn.disabled = false;
                btn.textContent = '📤 提交信息';
            }, 300);
        }

        function resetForm() {
            ['patientName','age','ethnicity','address','phone','stayMonths','stayDays','occupancyCount','diseaseDetail'].forEach(function(id) {
                var el = document.getElementById(id); if (el) el.value = '';
            });
            document.getElementById('checkInDate').value = new Date().toISOString().split('T')[0];
            document.querySelectorAll('input[type="radio"]').forEach(function(r) { r.checked = false; });
            document.getElementById('diseaseNo').checked = true;
            document.getElementById('diseaseDetailField').classList.remove('visible');
            uploadedFile = null;
            var prev = document.getElementById('uploadPreview'); prev.src = ''; prev.classList.remove('show');
            document.getElementById('uploadArea').classList.remove('has-file');
            document.getElementById('uploadRemove').classList.remove('show');
            document.getElementById('diagnosisFile').value = '';
            document.getElementById('formCard').style.display = 'block';
            document.getElementById('successPage').style.display = 'none';
        }

        function showAdmin() { document.getElementById('formPage').classList.add('admin-hidden'); document.getElementById('adminPage').classList.remove('admin-hidden'); }
        function showForm() { document.getElementById('adminPage').classList.add('admin-hidden'); document.getElementById('formPage').classList.remove('admin-hidden'); }

        function adminLogin() {
            if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
                document.getElementById('adminLoginCard').classList.add('admin-hidden');
                document.getElementById('adminPanel').classList.remove('admin-hidden');
                refreshRecords();
            } else showToast('密码错误','error');
        }

        function adminLogout() { document.getElementById('adminLoginCard').classList.remove('admin-hidden'); document.getElementById('adminPanel').classList.add('admin-hidden'); }

        function refreshRecords() {
            allRecords = getRecords();
            renderTable();
            showToast('数据已刷新','info');
        }

        function renderTable() {
            var search = (document.getElementById('searchInput')?.value || '').toLowerCase();
            var filtered = allRecords.filter(function(r) {
                return (r.patient_name||'').toLowerCase().includes(search) || (r.phone||'').includes(search);
            });
            document.getElementById('recordCount').textContent = allRecords.length;
            var tbody = document.getElementById('tableBody'), empty = document.getElementById('emptyState');
            if (filtered.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
            empty.style.display = 'none';
            tbody.innerHTML = filtered.map(function(r, i) {
                return '<tr onclick="viewDetail(' + r.id + ')"><td>' + (i+1) + '</td><td><strong>' + escapeHtml(r.patient_name) + '</strong></td><td>' + r.gender + '</td><td>' + r.age + '</td><td>' + r.phone + '</td><td>' + r.check_in_date + '</td><td>' + (r.stay_duration||'') + '</td><td>' + (r.has_infectious_disease==='有' ? '<span class="badge badge-yes">有</span>' : '<span class="badge badge-no">无</span>') + '</td><td>' + new Date(r.createdAt).toLocaleString() + '</td><td><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDelete(' + r.id + ')">🗑</button></td></tr>';
            }).join('');
        }

        function viewDetail(id) {
            var r = allRecords.find(function(x) { return x.id === id; });
            if (!r) return;
            document.getElementById('detailContent').innerHTML = '<button class="modal-close" onclick="closeDetail()">✕</button><h3>记录详情</h3>' +
                '<div class="detail-row"><span class="detail-label">姓名</span><span class="detail-value">' + escapeHtml(r.patient_name) + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">性别</span><span class="detail-value">' + r.gender + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">年龄</span><span class="detail-value">' + r.age + '岁</span></div>' +
                '<div class="detail-row"><span class="detail-label">住址</span><span class="detail-value">' + escapeHtml(r.address) + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">电话</span><span class="detail-value">' + r.phone + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">入住时间</span><span class="detail-value">' + r.check_in_date + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">时长</span><span class="detail-value">' + (r.stay_duration||'') + '</span></div>' +
                '<div class="detail-row"><span class="detail-label">传染性疾病</span><span class="detail-value">' + r.has_infectious_disease + (r.disease_detail?' - ' + escapeHtml(r.disease_detail):'') + '</span></div>' +
                '<button class="btn btn-danger btn-sm" onclick="confirmDelete(' + r.id + ');closeDetail();">删除</button>';
            document.getElementById('detailModal').classList.remove('admin-hidden');
        }

        function closeDetail() { document.getElementById('detailModal').classList.add('admin-hidden'); }

        function confirmDelete(id) {
            if (!confirm('确定删除？')) return;
            var records = getRecords();
            records = records.filter(function(r) { return r.id !== id; });
            saveRecords(records);
            showToast('已删除','info');
            refreshRecords();
        }

        function exportCSV() {
            if (!allRecords.length) return showToast('无数据','error');
            var headers = ['姓名','性别','年龄','电话','住址','入住时间','时长','传染性疾病','提交时间'];
            var rows = allRecords.map(function(r) {
                return [r.patient_name, r.gender, r.age, r.phone, r.address, r.check_in_date, r.stay_duration, r.has_infectious_disease, new Date(r.createdAt).toLocaleString()];
            });
            var csv = '\uFEFF' + [headers].concat(rows).map(function(row) {
                return row.map(function(c) { return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
            }).join('\n');
            var blob = new Blob([csv], {type:'text/csv'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '患者记录.csv';
            a.click();
            showToast('✅ 导出成功','success');
        }
    </script>
</body>
</html>
